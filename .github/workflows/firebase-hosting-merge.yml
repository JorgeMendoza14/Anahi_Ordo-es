# Publica la app en https://apkma-de1a3.web.app cada vez que se sube un cambio a main.
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APKMA_DE1A3 }}
          channelId: live
          projectId: apkma-de1a3

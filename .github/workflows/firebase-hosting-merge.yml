# Publica la app en https://apkma-de1a3.web.app cada vez que se sube un cambio a main.
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APKMA_DE1A3 }}
          channelId: live
          projectId: apkma-de1a3

  # Abre la app publicada en un navegador y anota errores (solo lectura)
  revisar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar la app publicada
        run: |
          cd .github
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node revisar-app.mjs
